  <!-- ═══════════════════════════════════════════════════════════════
       LIGHTBOX  —  "Lightroom Mode"
       This element is controlled by JavaScript below.
       You do not need to edit this HTML.
       ═══════════════════════════════════════════════════════════════ -->
  <div class="lightbox" id="js-lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">

    <div class="lightbox__bar">
      <span class="lightbox__counter" id="js-lb-counter" aria-live="polite"></span>
      <button class="lightbox__close" id="js-lb-close" aria-label="Close photo viewer">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="lightbox__stage">

      <button class="lightbox__nav lightbox__nav--prev" id="js-lb-prev" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <!-- ↓ The <img> src is swapped by JS — do not edit src here -->
      <img src="" alt="" class="lightbox__image" id="js-lb-image" />

      <button class="lightbox__nav lightbox__nav--next" id="js-lb-next" aria-label="Next photo">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>

    </div>

    <div class="lightbox__caption">
      <p class="lightbox__caption-title" id="js-lb-title"></p>
      <p class="lightbox__caption-meta"  id="js-lb-meta"></p>
    </div>

  </div><!-- /LIGHTBOX -->
